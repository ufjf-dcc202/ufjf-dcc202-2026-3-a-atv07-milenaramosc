<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1.0">
    <title> DCC202 CSS Embutido</title>
    <style>
        em {
            color:red;
            text-decoration: underline;
        }
        code {
            color:orange;
            text-decoration: underline;
        }
        li > code {
        /* body > main > ol > li:nth-child(1) > code { */
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>O estilo <em>embutido</em>
        é aplicado diretamente no elemento via atributo
        elemento via atributo
        <code>style</code>.</p>
        <ol>
            <li>
                <code>HELLO WORD!</code>
            </li>
            <li>
               <code>2+2 = 4</code> 
            </li>
        </ol>
    </main>
</body>
</html>
