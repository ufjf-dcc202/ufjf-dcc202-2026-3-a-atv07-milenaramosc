<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1.0">
    <title> DCC202 CSS Embutido</title>
    <style>
        em {
            color:red; 
            text-decoration: underline;
        }
        code {
            color:orange; 
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Em Linha</h1>
        <p>O estilo <em>em linha</em>
        é aplicado diretamente no elemento via atributo
        elemento via atributo
        <code>style</code>.</p>
    </main>
</body>
</html>
